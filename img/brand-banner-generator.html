<!doctype html><html class="theme-light"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { --font-text-theme: '??'; --font-text-override: '??'; --font-default: sans-serif;
         --font-text: var(--font-text-override), var(--font-text-theme), var(--font-default);
         --font-text-size: 14px; }
  .stage { width: 1200px; height: 800px; position: relative; overflow: hidden; }
  .bar { border-radius: 5px; background: currentColor; }
  .panel { position: absolute; inset: 0 770px 0 0; padding: 64px 52px; box-sizing: border-box;
           display: flex; flex-direction: column; background: rgb(32, 28, 19); color: rgb(252, 248, 239); }
  .tagline { font-family: var(--font-interface, sans-serif); font-size: 10.5px; letter-spacing: 0.18em;
             text-transform: uppercase; opacity: 0.55; }
  .wordmark { font-family: var(--font-headings, serif); font-weight: var(--font-semibold, 600);
              font-size: 54px; line-height: 1.05; margin-top: 16px; letter-spacing: -0.01em; }
  .rule { width: 88px; height: 3px; margin-top: 24px; border-radius: 2px;
          background-image: var(--scrip-editorial-rule-strong); background-size: 100% 100%; }
  .dots { margin-top: auto; display: flex; gap: 10px; align-items: center; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .vers { font-family: var(--font-interface, sans-serif); font-size: 11px; opacity: 0.55; margin-left: 6px; }
  .win { position: absolute; left: 470px; top: 120px; width: 700px; height: 560px;
         border-radius: 12px; overflow: hidden; display: flex;
         background: var(--background-primary);
         border: 1px solid color-mix(in srgb, var(--paper-frame-border) 55%, transparent);
         box-shadow: 0 30px 70px rgba(28, 24, 19, 0.26), 0 4px 14px rgba(28, 24, 19, 0.10); }
  .side { width: 176px; flex: none; padding: 14px 10px; box-sizing: border-box;
          background: var(--background-secondary);
          border-right: 1px solid color-mix(in srgb, var(--paper-frame-border) 30%, transparent); }
  .tree { display: flex; align-items: center; gap: 8px; padding: 5px 9px; border-radius: 5px; margin-bottom: 3px; }
  .tree.active { background: var(--background-modifier-hover); }
  .tw { width: 7px; height: 7px; border-radius: 2px; background: var(--text-faint); flex: none; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; gap: 4px; padding: 7px 12px 0; align-items: flex-end; flex: none; }
  .btab { position: relative; padding: 6px 15px 8px; border-radius: 7px 7px 0 0; }
  .btab.active { background: var(--layer-1); }
  .btab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
                border-radius: 2px; background: var(--interactive-accent); }
  .note { flex: 1; padding: 42px 48px; box-sizing: border-box; }
  .grp { margin-bottom: 42px; }
  .row { display: flex; gap: 13px; margin-bottom: 13px; }
  .b { height: 10px; }
  .blk { height: 13px; border-radius: 5px; }
  .task { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .chip { width: 15px; height: 15px; border-radius: 5px; flex: none;
          border: 1.5px solid color-mix(in srgb, var(--border-strong-1) 72%, transparent); }
  .chip.on { background: var(--interactive-accent); border-color: var(--interactive-accent); }
  .bcard { border: 1px solid color-mix(in srgb, var(--paper-frame-border) 64%, transparent);
             border-left: 4px solid color-mix(in srgb, rgb(var(--color-secondary-rgb)) 28%, transparent);
             border-radius: 8px; background: color-mix(in srgb, var(--panel-surface) 95%, transparent);
             padding: 12px 16px; }
  .co-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .co-ic { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgb(var(--color-secondary-rgb)); flex: none; }
</style>

          <div style="padding: 2px 0 0 16px; flex: 1;">
            <div class="row" style="margin-bottom: 10px;"><div class="bar b" style="width: 44%;"></div></div>

        <div class="grp">

        <div class="grp">

          <div class="task" style="margin-bottom: 0;"><div class="chip on"></div><div class="bar b" style="width: 27%; background: var(--text-muted);"></div></div>
        </div>
        <div class="bcard">
          <div class="co-row"><div class="bar" style="width: 118px; height: 9px; background: var(--scrip-ink-strong);"></div></div>
          <div class="row" style="margin-bottom: 0;"><div class="bar b" style="width: 56%; background: var(--text-muted);"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
